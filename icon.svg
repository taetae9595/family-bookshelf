<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="우리 가족 책장">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FDF8F0"/>
      <stop offset="1" stop-color="#F1E3CE"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0B183"/>
      <stop offset="0.45" stop-color="#C08A55"/>
      <stop offset="1" stop-color="#8F5A30"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#8A6A72"/>
